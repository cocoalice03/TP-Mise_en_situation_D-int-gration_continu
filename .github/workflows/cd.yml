name: CD

# Déploiement continu (spec §6), après une CI réussie sur main :
#   1. build   : construire l'image Docker et la publier sur Docker Hub ;
#   2. deploy  : sur la VM, récupérer (pull) l'image publiée, lancer les services
#                (MySQL, MinIO), exécuter la pipeline et planifier son lancement (cron).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Un seul déploiement à la fois ; un déploiement en cours n'est jamais interrompu.
concurrency:
  group: cd
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Le commit exact validé par la CI (pas le dernier de main).
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  # DOCKERHUB_USERNAME doit être en minuscules (exigence de Docker Hub).
  IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/transactions-pipeline

jobs:
  build:
    name: Build & Push Docker Hub
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.SHA }}

  deploy:
    name: Deploy on VM
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      # Fichiers nécessaires sur la VM : le compose et le script lancé par cron.
      - name: Copy deployment files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "docker-compose.yml,run-pipeline.sh"
          target: /home/${{ secrets.SSH_USER }}/transactions-app
          overwrite: true

      - name: Deploy application on VM
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_IMAGE: ${{ env.IMAGE }}:${{ env.SHA }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          MYSQL_USER: ${{ vars.MYSQL_USER }}
          MYSQL_DATABASE: ${{ vars.MYSQL_DATABASE }}
          MINIO_ROOT_USER: ${{ vars.MINIO_ROOT_USER }}
          MINIO_BUCKET: ${{ vars.MINIO_BUCKET }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script_stop: true
          envs: APP_IMAGE,MYSQL_ROOT_PASSWORD,MYSQL_PASSWORD,MINIO_ROOT_PASSWORD,MYSQL_USER,MYSQL_DATABASE,MINIO_ROOT_USER,MINIO_BUCKET
          script: |
            cd ~/transactions-app
            chmod +x run-pipeline.sh

            # .env de production (droits 600) : jamais dans le dépôt ni dans l'image
            ( umask 077
              {
                printf "APP_IMAGE='%s'\n" "$APP_IMAGE"
                printf "MYSQL_ROOT_PASSWORD='%s'\n" "$MYSQL_ROOT_PASSWORD"
                printf "MYSQL_PASSWORD='%s'\n" "$MYSQL_PASSWORD"
                printf "MYSQL_USER='%s'\n" "$MYSQL_USER"
                printf "MYSQL_DATABASE='%s'\n" "$MYSQL_DATABASE"
                printf "MINIO_ROOT_USER='%s'\n" "$MINIO_ROOT_USER"
                printf "MINIO_ROOT_PASSWORD='%s'\n" "$MINIO_ROOT_PASSWORD"
                printf "MINIO_BUCKET='%s'\n" "$MINIO_BUCKET"
              } > .env
            )

            # Pull de l'image publiée sur Docker Hub (dépôt public), puis lancement des services
            docker compose --profile job pull
            docker compose up -d --wait --wait-timeout 300 mysql minio

            # Première exécution : sert de test de fumée (échoue si l'application ne fonctionne pas)
            docker compose --profile job run --rm -T app

            # Lancement régulier : cron toutes les 5 minutes (entrée remplacée à chaque déploiement)
            marker="# transactions-pipeline"
            line="*/5 * * * * $HOME/transactions-app/run-pipeline.sh >> $HOME/transactions-app/pipeline.log 2>&1 $marker"
            ( crontab -l 2>/dev/null | grep -vF "$marker" || true; echo "$line" ) | crontab -

            echo "Deployment successful"

      - name: Diagnostic (en cas d'échec)
        if: failure()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd ~/transactions-app || exit 0
            docker compose ps -a
            docker compose logs --tail=80 mysql minio
            free -m
            df -h /
